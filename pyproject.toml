[project]
name = "sa-nno-drl"
version = "0.1.0"
description = "Multi-UAV mission planning with reinforcement learning and simulated annealing"
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy>=2.2,<3",
    "scipy>=1.15,<2",
    "pandas>=2.2,<3",
    "matplotlib>=3.10,<4",
    "tqdm>=4.67,<5",
    "tensorboard>=2.20,<3",
]

[project.optional-dependencies]
cu130 = ["torch==2.14.1+cu130"]
cpu = ["torch==2.14.1+cpu"]

[dependency-groups]
dev = ["pytest>=8.3,<10"]

[tool.uv]
package = false
conflicts = [[{ extra = "cpu" }, { extra = "cu130" }]]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu130", extra = "cu130" },
    { index = "pytorch-cpu", extra = "cpu" },
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
